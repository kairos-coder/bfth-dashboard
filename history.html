<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History — BFTH War Room</title>
<link rel="icon" href="./images/emblem.png" type="image/png">
<script src="https://code.highcharts.com/highcharts.js"></script>
<style>
  :root {
    --hero-image: url("./images/banner-warroom.png");
    --bg: #08090c; --bg-2: #0d0f14; --panel: #13161d; --panel-2: #1a1e27;
    --border: #242a36; --border-2: #2f3745; --text: #e6e8ec;
    --muted: #8a93a6; --dim: #4a5263;
    --gold: #d4af37; --gold-bright: #f0c850;
    --green: #4ade80; --red: #ef4444; --blue: #60a5fa; --purple: #a78bfa;
    --yellow: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; }
  .hero { position: relative; height: 220px; overflow: hidden;
    border-bottom: 2px solid var(--gold); background: var(--bg-2); }
  .hero-img { position: absolute; inset: 0; background-image: var(--hero-image);
    background-size: cover; background-position: center 45%; opacity: 0.55; }
  .hero::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8,9,12,0.4) 0%, rgba(8,9,12,0.1) 40%, rgba(8,9,12,0.96) 100%); }
  .hero-inner { position: relative; z-index: 2; height: 100%; display: flex;
    align-items: flex-end; justify-content: space-between;
    padding: 0 2rem 1.4rem; max-width: 1600px; margin: 0 auto; gap: 1rem; }
  .brand h1 { font-size: 2.1rem; margin: 0; letter-spacing: 0.08em; color: var(--gold-bright);
    text-shadow: 0 2px 14px rgba(0,0,0,0.85); font-weight: 800; }
  .brand .sub { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.18em;
    text-transform: uppercase; margin-top: 0.4rem; }
  .status { display: flex; align-items: center; gap: 0.5rem;
    background: rgba(13,15,20,0.85); border: 1px solid var(--border-2);
    padding: 0.5rem 0.95rem; border-radius: 999px; font-size: 0.78rem;
    color: var(--muted); backdrop-filter: blur(8px); flex-shrink: 0; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status-dot.fresh { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .status-dot.stale { background: var(--yellow); }
  .status-dot.dead { background: var(--red); }

  .nav { display: flex; background: var(--bg-2); border-bottom: 1px solid var(--border);
    padding: 0 2rem; overflow-x: auto; }
  .nav a { padding: 0.95rem 1.15rem; color: var(--muted); text-decoration: none;
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    border-bottom: 2px solid transparent; white-space: nowrap; transition: color 0.15s; }
  .nav a:hover { color: var(--text); }
  .nav a.active { color: var(--gold-bright); border-bottom-color: var(--gold); }

  /* ticker */
  .ticker-wrap { display: flex; align-items: stretch; background: var(--panel);
    border-bottom: 1px solid var(--border); height: 36px;
    max-width: 1600px; margin: 0 auto;
    border-left: 3px solid var(--gold); border-right: 3px solid var(--gold); overflow: hidden; }
  .ticker-label { background: var(--gold); color: var(--bg);
    font-size: 0.66rem; font-weight: 800; letter-spacing: 0.14em;
    padding: 0 1rem; display: flex; align-items: center;
    white-space: nowrap; flex-shrink: 0; }
  .ticker-track { flex: 1; display: flex; gap: 1.75rem; align-items: center;
    padding: 0 1rem; white-space: nowrap; overflow-x: auto;
    scrollbar-width: none; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .ticker-track::-webkit-scrollbar { display: none; }
  .ticker-item { display: inline-flex; gap: 0.4rem; align-items: center; flex-shrink: 0; }
  .ticker-item .t-name { color: var(--text); font-weight: 600; }
  .ticker-item .t-stat { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.04em; }
  .ticker-item .t-delta { font-weight: 700; font-size: 0.78rem; }
  .t-delta.up { color: var(--green); }
  .t-delta.down { color: var(--red); }
  .t-delta.flat { color: var(--dim); }

  /* toggle */
  .range-bar { max-width: 1600px; margin: 0 auto; padding: 1.5rem 2rem 0.5rem;
    display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .range-bar .label { color: var(--muted); font-size: 0.75rem;
    letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600;
    margin-right: 0.5rem; }
  .range-btn { background: var(--panel); color: var(--muted);
    border: 1px solid var(--border); padding: 0.5rem 0.9rem;
    border-radius: 6px; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: border-color 0.15s, color 0.15s; }
  .range-btn:hover { color: var(--text); border-color: var(--border-2); }
  .range-btn.active { background: var(--panel-2); color: var(--gold-bright); border-color: var(--gold); }
  .range-bar .baseline { color: var(--dim); font-size: 0.75rem; margin-left: auto;
    font-variant-numeric: tabular-nums; }

  /* summary strip */
  .summary { max-width: 1600px; margin: 0 auto; padding: 0.75rem 2rem 1rem;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; }
  .sum-card { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.85rem 1rem; }
  .sum-card .label { color: var(--muted); font-size: 0.65rem;
    letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
    margin-bottom: 0.35rem; }
  .sum-card .value { font-size: 1.4rem; font-weight: 800;
    font-variant-numeric: tabular-nums; }
  .sum-card .value.up { color: var(--green); }
  .sum-card .value.down { color: var(--red); }
  .sum-card .sub { font-size: 0.72rem; color: var(--dim); margin-top: 0.2rem; }

  /* table */
  .table-wrap { max-width: 1600px; margin: 0 auto; padding: 0 2rem 3rem; overflow-x: auto; }
  .movers-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .movers-table thead th {
    text-align: left; padding: 0.75rem 0.75rem;
    color: var(--muted); font-size: 0.7rem; letter-spacing: 0.12em;
    text-transform: uppercase; font-weight: 700;
    border-bottom: 2px solid var(--border-2); white-space: nowrap;
  }
  .movers-table thead th.num { text-align: right; }
  .movers-table tbody tr { border-bottom: 1px solid #1a1a22; }
  .movers-table tbody tr:hover { background: var(--panel-2); }
  .movers-table tbody td { padding: 0.65rem 0.75rem; }
  .movers-table tbody td.num {
    text-align: right; font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .movers-table .p-name { font-weight: 600; color: var(--text); }
  .movers-table .p-name a { color: inherit; text-decoration: none; }
  .movers-table .p-name a:hover { color: var(--gold-bright); }
  .movers-table .p-state { color: var(--dim); font-size: 0.75rem; }
  .movers-table .delta-cell { font-variant-numeric: tabular-nums; font-weight: 700; }
  .delta-cell.up { color: var(--green); }
  .delta-cell.down { color: var(--red); }
  .delta-cell.flat { color: var(--dim); }
  .movers-table .val-col { color: var(--text); font-variant-numeric: tabular-nums; }

  .empty { color: var(--muted); text-align: center; padding: 3rem 1rem; font-size: 0.9rem; }

  #error { color: var(--red); padding: 1rem; background: #1a0a0a;
    border: 1px solid #3a1a1a; border-radius: 6px; margin: 1rem 2rem; }

  .footer { border-top: 1px solid var(--border); padding: 1.5rem 2rem;
    color: var(--dim); font-size: 0.75rem; text-align: center; letter-spacing: 0.06em; }

  @media (max-width: 700px) {
    .hero { height: 170px; }
    .hero-inner { padding: 0 1rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .brand h1 { font-size: 1.45rem; }
    .nav { padding: 0 0.5rem; }
    .nav a { padding: 0.8rem 0.7rem; font-size: 0.72rem; }
    .range-bar, .summary, .table-wrap { padding-left: 1rem; padding-right: 1rem; }
    .movers-table { font-size: 0.78rem; }
    .movers-table thead th, .movers-table tbody td { padding: 0.5rem 0.35rem; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-img"></div>
  <div class="hero-inner">
    <div class="brand">
      <h1>HISTORY</h1>
      <div class="sub">Overnight Deltas &amp; Time Series</div>
    </div>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Loading…</span>
    </div>
  </div>
</div>

<nav class="nav">
  <a href="./index.html">Roster</a>
  <a href="./caucus.html">Caucus</a>
  <a href="./elections.html">Elections</a>
  <a href="./history.html" class="active">History</a>
</nav>

<div class="ticker-wrap">
  <div class="ticker-label">TOP MOVERS</div>
  <div class="ticker-track" id="tickerTrack">
    <span style="color:var(--muted);font-style:italic">loading…</span>
  </div>
</div>

<div class="range-bar">
  <span class="label">Range:</span>
  <button class="range-btn active" data-range="day">1 Day</button>
  <button class="range-btn" data-range="week">1 Week</button>
  <span class="baseline" id="baselineLabel"></span>
</div>

<div class="summary" id="summary"></div>

<div class="table-wrap">
  <table class="movers-table">
    <thead>
      <tr>
        <th>Player</th>
        <th class="num">NP</th>
        <th class="num">Δ NP</th>
        <th class="num">CS</th>
        <th class="num">Δ CS</th>
        <th class="num">CF</th>
        <th class="num">Δ CF</th>
        <th class="num">NW</th>
        <th class="num">Δ NW</th>
        <th class="num">LC/hr</th>
        <th class="num">Δ LC/hr</th>
      </tr>
    </thead>
    <tbody id="moversBody">
      <tr><td colspan="11" class="empty">Loading history…</td></tr>
    </tbody>
  </table>
</div>

<div class="footer">
  BFTH War Room · Roster · Caucus · Elections · History
</div>

<script>
const REPO_OWNER = "kairos-coder";
const REPO_NAME = "bfth-dashboard";
const CONTENTS_API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data/players`;

const escapeHtml = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[ch]));

const shortMoney = (n) => {
  if (n == null) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return "$" + (n / 1e6).toFixed(1) + "M";
  if (a >= 1e3) return "$" + (n / 1e3).toFixed(0) + "K";
  return "$" + Number(n).toFixed(0);
};

const num = (n, d = 1) => n == null ? "—"
  : Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n) => n == null ? "—" : num(n, 1) + "%";

function shortVal(stat, v) {
  if (v == null) return "—";
  if (stat === "NP") return num(v, 1);
  if (stat === "CS") return num(v, 1);
  if (stat === "CF" || stat === "NW" || stat === "LC/hr") return shortMoney(v);
  if (stat === "SR" || stat === "NR") return pct(v);
  return num(v, 1);
}

function deltaCell(delta, stat) {
  if (delta == null || delta === 0) {
    return `<td class="num delta-cell flat">·</td>`;
  }
  const sign = delta > 0 ? "up" : "down";
  const arrow = delta > 0 ? "▲" : "▼";
  const prefix = delta > 0 ? "+" : "-";
  let mag;
  if (stat === "NP") mag = num(Math.abs(delta), 1);
  else if (stat === "CS") mag = num(Math.abs(delta), 1);
  else if (stat === "CF" || stat === "NW" || stat === "LC/hr") mag = shortMoney(Math.abs(delta));
  else if (stat === "SR" || stat === "NR") mag = pct(Math.abs(delta));
  else mag = num(Math.abs(delta), 1);
  return `<td class="num delta-cell ${sign}">${arrow} ${prefix}${mag}</td>`;
}

// ---- GitHub API: list archive files ----
async function listArchives() {
  const res = await fetch(CONTENTS_API, { cache: "no-store" });
  if (!res.ok) throw new Error(`GitHub API ${res.status}`);
  const files = await res.json();
  return (files || [])
    .filter(f => f.type === "file" && /^\d{4}-\d{2}-\d{2}T\d{2}\.json$/.test(f.name))
    .map(f => f.name)
    .sort();
}

function todayUTC() {
  return new Date().toISOString().slice(0, 10);
}

function pickDayBaseline(archives, today) {
  // newest archive whose date is strictly before today
  const prior = archives.filter(n => n.slice(0, 10) < today);
  return prior.length > 0 ? prior[prior.length - 1] : null;
}

function pickWeekBaseline(archives, today) {
  // newest archive at least 7 days before today; fallback to oldest prior-day
  const todayMs = Date.parse(today + "T00:00:00Z");
  const prior = archives.filter(n => n.slice(0, 10) < today);
  if (prior.length === 0) return null;
  const oldEnough = prior.filter(n => {
    const ms = Date.parse(n.slice(0, 10) + "T00:00:00Z");
    return (todayMs - ms) / 86400000 >= 7;
  });
  if (oldEnough.length > 0) return oldEnough[oldEnough.length - 1];
  return prior[0]; // oldest prior
}

// ---- fetch data ----
async function fetchJSON(path) {
  const res = await fetch(path + (path.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(`${path} HTTP ${res.status}`);
  return res.json();
}

// ---- render ----
function computeMovers(current, previous, range) {
  const prevById = new Map();
  for (const p of previous) {
    if (p.id) prevById.set(String(p.id), p);
  }

  const movers = [];
  for (const p of current) {
    const prev = prevById.get(String(p.id));
    if (!prev) continue;

    const diff = (field) => {
      const cv = p[field];
      const pv = prev[field];
      if (cv == null || pv == null) return null;
      return cv - pv;
    };

    const deltas = {
      np: diff("national_prestige"),
      cs: diff("campaign_strength"),
      cf: diff("campaign_funds"),
      nw: diff("total_net_worth"),
      lc: diff("lc_income_hr"),
      sr: diff("state_reputation"),
      nr: diff("national_reputation"),
    };

    // biggest-magnitude stat for ranking/ticker
    const candidates = [
      { stat: "NP", delta: deltas.np, mag: Math.abs(deltas.np ?? 0) },
      { stat: "CS", delta: deltas.cs, mag: Math.abs(deltas.cs ?? 0) * 8 },
      { stat: "CF", delta: deltas.cf, mag: Math.abs(deltas.cf ?? 0) / 250000 },
      { stat: "NW", delta: deltas.nw, mag: Math.abs(deltas.nw ?? 0) / 5000000 },
      { stat: "LC/hr", delta: deltas.lc, mag: Math.abs(deltas.lc ?? 0) / 5000 },
    ].filter(c => c.delta != null && c.mag > 0.001);

    if (candidates.length === 0) continue;
    candidates.sort((a, b) => b.mag - a.mag);
    const top = candidates[0];

    movers.push({
      id: p.id,
      name: p.name,
      state: p.state,
      politician_id: p.politician_id || p.id,
      current: p,
      previous: prev,
      deltas,
      topStat: top.stat,
      topDelta: top.delta,
      topMag: top.mag,
      range,
    });
  }

  movers.sort((a, b) => b.topMag - a.topMag);
  return movers;
}

function renderTicker(movers, baselineFile) {
  const track = document.getElementById("tickerTrack");
  if (!movers.length) {
    track.innerHTML = `<span style="color:var(--muted);font-style:italic">no movers to show</span>`;
    return;
  }
  const top = movers.slice(0, 40);
  track.innerHTML = top.map(m => {
    const sign = m.topDelta > 0 ? "up" : m.topDelta < 0 ? "down" : "flat";
    const arrow = sign === "up" ? "▲" : sign === "down" ? "▼" : "·";
    const prefix = m.topDelta > 0 ? "+" : m.topDelta < 0 ? "-" : "";
    const formatted = shortVal(m.topStat, Math.abs(m.topDelta));
    return `<span class="ticker-item">
      <span class="t-name">${escapeHtml(m.name)}</span>
      <span class="t-stat">${m.topStat}</span>
      <span class="t-delta ${sign}">${arrow} ${prefix}${formatted}</span>
    </span>`;
  }).join("");
}

function renderSummary(movers) {
  const el = document.getElementById("summary");
  if (!movers.length) { el.innerHTML = ""; return; }

  const gainers = movers.filter(m => m.topDelta > 0);
  const losers = movers.filter(m => m.topDelta < 0);

  // biggest single gainer / loser
  const bigGain = gainers[0];
  const bigLoss = losers[0];

  // total NP moved across the roster
  let totalNP = 0;
  for (const m of movers) {
    if (m.deltas.np != null) totalNP += m.deltas.np;
  }

  const cards = [
    {
      label: "Gainers",
      value: gainers.length,
      cls: "up",
      sub: `${movers.length} tracked, ${losers.length} losers`
    },
    {
      label: "Total NP Δ",
      value: (totalNP > 0 ? "+" : "") + num(totalNP, 1),
      cls: totalNP > 0 ? "up" : totalNP < 0 ? "down" : "",
      sub: "sum across roster"
    },
    bigGain ? {
      label: "Top Gainer",
      value: bigGain.name,
      cls: "up",
      sub: `${bigGain.topStat} ${bigGain.topDelta > 0 ? "+" : ""}${shortVal(bigGain.topStat, bigGain.topDelta)}`
    } : null,
    bigLoss ? {
      label: "Top Loser",
      value: bigLoss.name,
      cls: "down",
      sub: `${bigLoss.topStat} ${shortVal(bigLoss.topStat, bigLoss.topDelta)}`
    } : null,
  ].filter(Boolean);

  el.innerHTML = cards.map(c => `
    <div class="sum-card">
      <div class="label">${escapeHtml(c.label)}</div>
      <div class="value ${c.cls}">${escapeHtml(String(c.value))}</div>
      <div class="sub">${escapeHtml(c.sub)}</div>
    </div>
  `).join("");
}

function renderTable(movers) {
  const tbody = document.getElementById("moversBody");
  if (!movers.length) {
    tbody.innerHTML = `<tr><td colspan="11" class="empty">No movers to show for this range.</td></tr>`;
    return;
  }
  tbody.innerHTML = movers.map(m => {
    const p = m.current;
    const d = m.deltas;
    const nameLink = m.politician_id
      ? `<a href="https://battleforthehill.com/politician/${m.politician_id}" target="_blank" rel="noopener">${escapeHtml(m.name)}</a>`
      : escapeHtml(m.name);
    return `<tr>
      <td><div class="p-name">${nameLink}</div><div class="p-state">${escapeHtml(m.state || "")}</div></td>
      <td class="num val-col">${num(p.national_prestige, 1)}</td>
      ${deltaCell(d.np, "NP")}
      <td class="num val-col">${num(p.campaign_strength, 1)}</td>
      ${deltaCell(d.cs, "CS")}
      <td class="num val-col">${shortMoney(p.campaign_funds)}</td>
      ${deltaCell(d.cf, "CF")}
      <td class="num val-col">${shortMoney(p.total_net_worth)}</td>
      ${deltaCell(d.nw, "NW")}
      <td class="num val-col">${shortMoney(p.lc_income_hr)}</td>
      ${deltaCell(d.lc, "LC/hr")}
    </tr>`;
  }).join("");
}

// ---- main ----
let STATE = {
  current: null,
  archives: [],
  dayBaseline: null,
  weekBaseline: null,
  dayMovers: [],
  weekMovers: [],
  range: "day",
};

async function loadAll() {
  const errEl = document.getElementById("error");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  try {
    STATE.archives = await listArchives();
    STATE.current = await fetchJSON("./data/players/latest.json");

    const today = todayUTC();
    STATE.dayBaseline = pickDayBaseline(STATE.archives, today);
    STATE.weekBaseline = pickWeekBaseline(STATE.archives, today);

    // fetch baselines
    let dayData = null, weekData = null;
    if (STATE.dayBaseline) {
      dayData = await fetchJSON("./data/players/" + STATE.dayBaseline);
    }
    if (STATE.weekBaseline && STATE.weekBaseline !== STATE.dayBaseline) {
      weekData = await fetchJSON("./data/players/" + STATE.weekBaseline);
    } else {
      weekData = dayData;
    }

    // compute movers
    STATE.dayMovers = dayData ? computeMovers(STATE.current.players || [], dayData.players || [], "day") : [];
    STATE.weekMovers = weekData ? computeMovers(STATE.current.players || [], weekData.players || [], "week") : [];

    statusDot.className = "status-dot fresh";
    statusText.textContent = `Updated ${STATE.current.generated_at ? new Date(STATE.current.generated_at).toLocaleString() : "unknown"}`;

    render();
  } catch (e) {
    console.error(e);
    statusDot.className = "status-dot dead";
    statusText.textContent = "Error loading";
    errEl.textContent = e.message || "Failed to load history data";
    document.getElementById("moversBody").innerHTML = `<tr><td colspan="11" class="empty">${escapeHtml(e.message || "error")}</td></tr>`;
  }
}

function render() {
  const movers = STATE.range === "day" ? STATE.dayMovers : STATE.weekMovers;
  const baselineFile = STATE.range === "day" ? STATE.dayBaseline : STATE.weekBaseline;

  document.getElementById("baselineLabel").textContent = baselineFile
    ? `vs ${baselineFile.replace(".json", "").replace("T", " ")}`
    : "no baseline";

  renderTicker(movers, baselineFile);
  renderSummary(movers);
  renderTable(movers);

  document.querySelectorAll(".range-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.range === STATE.range);
  });
}

document.querySelectorAll(".range-btn").forEach(b => {
  b.addEventListener("click", () => {
    STATE.range = b.dataset.range;
    render();
  });
});

loadAll();
</script>

</body>
</html>
