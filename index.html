<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFTH War Room — GOP Roster</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1c1c1c;
    --border: #2a2a2a;
    --text: #e5e5e5;
    --muted: #888;
    --dim: #555;
    --gold: #FFD700;
    --green: #4ade80;
    --red: #ef4444;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --yellow: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
    min-height: 100vh;
  }
  header {
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
  }
  h1 {
    font-size: 1.75rem;
    margin: 0 0 0.25rem;
    color: var(--gold);
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .subtitle strong { color: var(--text); }

  .controls {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls input,
  .controls select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.6rem 0.9rem;
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .controls input:focus,
  .controls select:focus {
    outline: none;
    border-color: var(--blue);
  }
  .controls input { flex: 1; min-width: 240px; }
  .controls .count {
    color: var(--muted);
    font-size: 0.85rem;
    margin-left: auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.25rem;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    position: relative;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover {
    border-color: var(--dim);
    transform: translateY(-1px);
  }

  .card-header {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    margin-bottom: 0.75rem;
  }
  .card-header img {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--panel-2);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .card-header .info {
    flex: 1;
    min-width: 0;
  }
  .card-header h2 {
    font-size: 1.05rem;
    margin: 0 0 0.15rem;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-header .sub {
    color: var(--muted);
    font-size: 0.8rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    align-items: center;
  }

  .rank {
    position: absolute;
    top: 0.75rem;
    right: 0.9rem;
    color: var(--dim);
    font-size: 0.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .badge {
    display: inline-block;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge-alt { background: #3a2a1a; color: var(--yellow); }
  .badge-married { background: #2a1a3a; color: var(--purple); }
  .badge-kofi { background: #1a2a3a; color: var(--blue); }
  .badge-inactive { background: #2a1a1a; color: var(--red); }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.35rem 1rem;
    font-size: 0.85rem;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    padding: 0.15rem 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .stat:last-child { border-bottom: none; }
  .stat .label { color: var(--muted); }
  .stat .val {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .val.np { color: var(--yellow); }
  .val.cs { color: var(--blue); }
  .val.sr { color: var(--blue); }
  .val.nr { color: var(--blue); }
  .val.cf { color: var(--green); }
  .val.nw { color: var(--gold); }

  .money-block {
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.35rem 1rem;
    font-size: 0.8rem;
  }
  .money-block .label { color: var(--muted); }
  .money-block .val {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  #error {
    color: var(--red);
    padding: 1rem;
    background: #1a0a0a;
    border: 1px solid #3a1a1a;
    border-radius: 6px;
    margin-bottom: 1.5rem;
  }
  #loading {
    color: var(--muted);
    text-align: center;
    padding: 3rem;
    font-size: 1rem;
  }

  @media (max-width: 600px) {
    body { padding: 1rem; }
    h1 { font-size: 1.4rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>BFTH War Room</h1>
  <div class="subtitle" id="meta">Loading roster…</div>
</header>

<div id="error"></div>
<div id="loading">Loading…</div>

<div class="controls" style="display:none" id="controls">
  <input id="search" type="search" placeholder="Search name, state, or discord…" autocomplete="off">
  <select id="sort">
    <option value="np">Sort: National Prestige</option>
    <option value="nw">Sort: Net Worth</option>
    <option value="cf">Sort: Campaign Funds</option>
    <option value="cs">Sort: Campaign Strength</option>
    <option value="sr">Sort: State Reputation</option>
    <option value="nr">Sort: National Reputation</option>
    <option value="name">Sort: Name</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"></div>

<script>
const DATA_URL = "./data/players/latest.json";

const money = (n) => n == null ? "—" :
  "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });

const num = (n, d = 1) => n == null ? "—" :
  Number(n).toLocaleString("en-US", {
    minimumFractionDigits: d,
    maximumFractionDigits: d
  });

const pct = (n) => n == null ? "—" : num(n, 1) + "%";

function shortMoney(n) {
  if (n == null) return "—";
  if (n >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return "$" + (n / 1e3).toFixed(0) + "K";
  return "$" + n.toFixed(0);
}

let allPlayers = [];
let filtered = [];
let kofiDiscords = new Set();

function buildKofiSet(players) {
  const counts = {};
  for (const p of players) {
    if (p.discord) counts[p.discord] = (counts[p.discord] || 0) + 1;
  }
  kofiDiscords = new Set(
    Object.entries(counts).filter(([, c]) => c >= 3).map(([d]) => d)
  );
}

function render() {
  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = '<div style="color:var(--muted);grid-column:1/-1;text-align:center;padding:2rem">No players match.</div>';
    return;
  }

  grid.innerHTML = filtered.map((p, i) => {
    const badges = [];
    if (p.alt) badges.push(`<span class="badge badge-alt">ALT: ${escapeHtml(p.alt.name)}</span>`);
    if (p.marriage && p.marriage !== "Single") {
      badges.push(`<span class="badge badge-married">💍 ${escapeHtml(p.marriage)}</span>`);
    }
    if (p.discord && kofiDiscords.has(p.discord)) {
      badges.push(`<span class="badge badge-kofi">KOFI</span>`);
    }
    if (!p.discord) {
      badges.push(`<span class="badge badge-inactive">NO DISCORD</span>`);
    }

    const imgSrc = p.profile_image || "";
    const imgTag = imgSrc
      ? `<img src="${escapeAttr(imgSrc)}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : `<img alt="" style="visibility:hidden">`;

    return `
      <div class="card">
        <div class="rank">#${i + 1}</div>
        <div class="card-header">
          ${imgTag}
          <div class="info">
            <h2>${escapeHtml(p.name || "Unknown")}</h2>
            <div class="sub">
              ${escapeHtml(p.state || "—")}
              ${badges.length ? " · " + badges.join(" ") : ""}
            </div>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><span class="label">NP</span><span class="val np">${num(p.national_prestige)}</span></div>
          <div class="stat"><span class="label">CS</span><span class="val cs">${num(p.campaign_strength)}</span></div>
          <div class="stat"><span class="label">SR</span><span class="val sr">${pct(p.state_reputation)}</span></div>
          <div class="stat"><span class="label">NR</span><span class="val nr">${pct(p.national_reputation)}</span></div>
          <div class="stat"><span class="label">CF</span><span class="val cf">${shortMoney(p.campaign_funds)}</span></div>
          <div class="stat"><span class="label">PC</span><span class="val">${num(p.political_capital)}</span></div>
        </div>

        <div class="money-block">
          <span class="label">Net Worth</span>
          <span class="val nw">${shortMoney(p.total_net_worth)}</span>
          <span class="label">LC / hr</span>
          <span class="val cf">${shortMoney(p.lc_income_hr)}</span>
          <span class="label">Liquid</span>
          <span class="val cf">${shortMoney(p.liquid_capital)}</span>
          <span class="label">Military</span>
          <span class="val">${num(p.military_influence, 0)}</span>
        </div>
      </div>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  }[ch]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, "&quot;");
}

function applyFilterSort() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const sortKey = document.getElementById("sort").value;

  filtered = allPlayers.filter(p => {
    if (!q) return true;
    const hay = [
      p.name, p.state, p.discord,
      p.alt && p.alt.name,
      p.marriage
    ].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  });

  const keyMap = {
    np: "national_prestige",
    nw: "total_net_worth",
    cf: "campaign_funds",
    cs: "campaign_strength",
    sr: "state_reputation",
    nr: "national_reputation"
  };

  if (sortKey === "name") {
    filtered.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  } else {
    const k = keyMap[sortKey];
    filtered.sort((a, b) => (b[k] ?? -Infinity) - (a[k] ?? -Infinity));
  }

  document.getElementById("count").textContent =
    `${filtered.length} of ${allPlayers.length} players`;
  render();
}

async function main() {
  const errEl = document.getElementById("error");
  const loadEl = document.getElementById("loading");

  let res;
  try {
    res = await fetch(DATA_URL, { cache: "no-store" });
  } catch (e) {
    loadEl.style.display = "none";
    errEl.textContent = "Fetch failed: " + e.message;
    return;
  }

  if (!res.ok) {
    loadEl.style.display = "none";
    errEl.textContent = `HTTP ${res.status} — ${DATA_URL} not found`;
    return;
  }

  const data = await res.json();
  allPlayers = data.players || [];
  buildKofiSet(allPlayers);

  const gen = data.generated_at
    ? new Date(data.generated_at).toLocaleString()
    : "unknown";
  const npc = data.npc_filtered != null ? `, ${data.npc_filtered} NPCs filtered` : "";

  document.getElementById("meta").innerHTML =
    `<strong>${allPlayers.length}</strong> players${escapeHtml(npc)} · last updated <strong>${escapeHtml(gen)}</strong>`;

  loadEl.style.display = "none";
  document.getElementById("controls").style.display = "flex";

  document.getElementById("search").addEventListener("input", applyFilterSort);
  document.getElementById("sort").addEventListener("change", applyFilterSort);

  applyFilterSort();
}

main();
</script>

</body>
</html>
