<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFTH War Room — GOP</title>
<link rel="icon" href="./images/emblem.png" type="image/png">
<meta property="og:title" content="BFTH War Room — GOP">
<meta property="og:description" content="Live roster, campaign funds, and net worth for the Republican caucus.">
<meta property="og:image" content="./images/banner-warroom.png">
<style>
  :root {
    --hero-image: url("./images/banner-warroom.png");
    --bg: #08090c;
    --bg-2: #0d0f14;
    --panel: #13161d;
    --panel-2: #1a1e27;
    --border: #242a36;
    --border-2: #2f3745;
    --text: #e6e8ec;
    --muted: #8a93a6;
    --dim: #4a5263;
    --gold: #d4af37;
    --gold-bright: #f0c850;
    --green: #4ade80;
    --red: #ef4444;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --yellow: #fbbf24;
    --tier-s: #d4af37;
    --tier-a: #60a5fa;
    --tier-b: #3a4150;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HERO */
  .hero {
    position: relative;
    height: 220px;
    overflow: hidden;
    border-bottom: 2px solid var(--gold);
    background: var(--bg-2);
  }
  .hero-img {
    position: absolute;
    inset: 0;
    background-image: var(--hero-image);
    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
    opacity: 0.6;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(8,9,12,0.4) 0%, rgba(8,9,12,0.1) 40%, rgba(8,9,12,0.96) 100%),
      linear-gradient(90deg, rgba(8,9,12,0.75) 0%, transparent 25%, transparent 75%, rgba(8,9,12,0.75) 100%);
  }
  .hero-inner {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 2rem 1.4rem;
    gap: 1rem;
    max-width: 1600px;
    margin: 0 auto;
  }
  .brand h1 {
    font-size: 2.1rem;
    margin: 0;
    letter-spacing: 0.08em;
    color: var(--gold-bright);
    text-shadow: 0 2px 14px rgba(0,0,0,0.85);
    font-weight: 800;
  }
  .brand .sub {
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 0.4rem;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(13,15,20,0.85);
    border: 1px solid var(--border-2);
    padding: 0.5rem 0.95rem;
    border-radius: 999px;
    font-size: 0.78rem;
    color: var(--muted);
    backdrop-filter: blur(8px);
    flex-shrink: 0;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .status-dot.fresh { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .status-dot.stale { background: var(--yellow); }
  .status-dot.dead  { background: var(--red); }

  /* NAV */
  .nav {
    display: flex;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    overflow-x: auto;
  }
  .nav a {
    padding: 0.95rem 1.15rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .nav a:hover { color: var(--text); }
  .nav a.active {
    color: var(--gold-bright);
    border-bottom-color: var(--gold);
  }
  .nav a.soon { color: var(--dim); }
  .nav a.soon:hover { color: var(--muted); }
  .nav a.soon::after {
    content: "SOON";
    font-size: 0.55rem;
    background: var(--panel-2);
    color: var(--muted);
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    margin-left: 0.5rem;
    vertical-align: middle;
    letter-spacing: 0.1em;
  }

  /* STAT STRIP */
  .stat-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 0.75rem;
    padding: 1.5rem 2rem 0.75rem;
    max-width: 1600px;
    margin: 0 auto;
  }
  .stat-card {
    background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
  }
  .stat-card .label {
    color: var(--muted);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 0.45rem;
    font-weight: 600;
  }
  .stat-card .value {
    font-size: 1.7rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .stat-card.gold .value { color: var(--gold-bright); }
  .stat-card.green .value { color: var(--green); }

  /* CONTROLS */
  .controls-wrap {
    max-width: 1600px;
    margin: 0 auto;
    padding: 1.5rem 2rem 0.9rem;
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls-wrap input,
  .controls-wrap select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.65rem 0.95rem;
    border-radius: 6px;
    font-size: 0.88rem;
    font-family: inherit;
  }
  .controls-wrap input:focus,
  .controls-wrap select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.12);
  }
  .controls-wrap input { flex: 1; min-width: 240px; }
  .controls-wrap .count {
    color: var(--muted);
    font-size: 0.82rem;
    margin-left: auto;
  }

  /* GRID */
  .grid-wrap {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 2rem 3rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 1.25rem;
  }

  /* CARD */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--tier-b);
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    position: relative;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.2s;
  }
  .card:hover {
    border-color: var(--border-2);
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
  }
  .card.tier-s {
    border-left-color: var(--tier-s);
    background: linear-gradient(135deg, #15120a 0%, var(--panel) 45%);
  }
  .card.tier-s:hover { box-shadow: 0 10px 30px rgba(212,175,55,0.14); }
  .card.tier-a { border-left-color: var(--tier-a); }
  .card.tier-a:hover { box-shadow: 0 10px 28px rgba(96,165,250,0.1); }
  .card.dormant { opacity: 0.55; }
  .card.dormant:hover { opacity: 0.9; }

  .card-header {
    display: flex;
    gap: 0.85rem;
    align-items: flex-start;
    margin-bottom: 0.75rem;
  }
  .card-header .avatar {
    width: 64px; height: 64px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--panel-2);
    flex-shrink: 0;
    border: 1px solid var(--border-2);
    transition: filter 0.15s;
  }
  .card:hover .avatar { filter: brightness(1.15); }
  .card-header .info { flex: 1; min-width: 0; }
  .card-header .name-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.25rem;
  }
  .card-header h2 {
    font-size: 1.05rem;
    margin: 0;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-header h2 a { color: inherit; text-decoration: none; }
  .card-header h2 a:hover { color: var(--gold-bright); }
  .rank-chip {
    flex-shrink: 0;
    font-size: 0.7rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    background: var(--panel-2);
    border: 1px solid var(--border-2);
    color: var(--muted);
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
  }
  .card.tier-s .rank-chip { color: var(--gold-bright); border-color: var(--gold); }
  .card.tier-a .rank-chip { color: var(--blue); border-color: var(--blue); }

  .card-header .meta-row {
    color: var(--muted);
    font-size: 0.76rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    align-items: center;
  }
  .card-header .bfth-link {
    display: inline-block;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.7rem;
    margin-top: 0.4rem;
    letter-spacing: 0.06em;
  }
  .card-header .bfth-link:hover { color: var(--gold-bright); }

  .badge {
    display: inline-block;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .badge-party { background: #3a1414; color: #f87171; }
  .badge-alt { background: #3a2a1a; color: var(--yellow); }
  .badge-married { background: #2a1a3a; color: var(--purple); }
  .badge-kofi { background: #1a2a3a; color: var(--blue); }
  .badge-dormant { background: #3a1a1a; color: var(--red); }
  .badge-nodc { background: #2a1a1a; color: var(--red); }

  /* NP rank bar */
  .np-bar-wrap {
    height: 4px;
    background: var(--bg-2);
    border-radius: 2px;
    margin: 0.65rem 0 0.9rem;
    overflow: hidden;
  }
  .np-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--tier-b), var(--gold));
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .card.tier-a .np-bar {
    background: linear-gradient(90deg, var(--tier-b), var(--blue));
  }
  .card.dormant .np-bar { background: var(--dim); }

  /* Stat groups */
  .stat-groups {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.55rem;
    font-size: 0.8rem;
  }
  .stat-group {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.55rem 0.65rem;
  }
  .stat-group .group-label {
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 0.35rem;
    font-weight: 700;
  }
  .stat-group .stat {
    display: flex;
    justify-content: space-between;
    padding: 0.13rem 0;
    font-size: 0.77rem;
  }
  .stat-group .stat .label { color: var(--muted); }
  .stat-group .stat .val {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .val.np { color: var(--yellow); }
  .val.cs, .val.sr, .val.nr { color: var(--blue); }
  .val.cf, .val.nw { color: var(--green); }
  .val.pc, .val.mil { color: var(--muted); }

  #error {
    color: var(--red);
    padding: 1rem;
    background: #1a0a0a;
    border: 1px solid #3a1a1a;
    border-radius: 6px;
    margin: 1rem 2rem;
  }
  #loading {
    color: var(--muted);
    text-align: center;
    padding: 4rem;
    font-size: 1rem;
  }

  .footer {
    border-top: 1px solid var(--border);
    padding: 1.5rem 2rem;
    color: var(--dim);
    font-size: 0.75rem;
    text-align: center;
    letter-spacing: 0.06em;
  }

  @media (max-width: 700px) {
    .hero { height: 170px; }
    .hero-inner { padding: 0 1rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .brand h1 { font-size: 1.45rem; }
    .nav { padding: 0 0.5rem; }
    .nav a { padding: 0.8rem 0.7rem; font-size: 0.72rem; }
    .stat-strip, .controls-wrap, .grid-wrap { padding-left: 1rem; padding-right: 1rem; }
    .grid { grid-template-columns: 1fr; }
    .stat-groups { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-img"></div>
  <div class="hero-inner">
    <div class="brand">
      <h1>BFTH WAR ROOM</h1>
      <div class="sub">Republican Party · Vice Chair's Briefing</div>
    </div>
    <div class="status" id="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Loading…</span>
    </div>
  </div>
</div>

<nav class="nav">
  <a href="./index.html" class="active">Roster</a>
  <a href="./caucus.html" class="soon">Caucus</a>
  <a href="./elections.html" class="soon">Elections</a>
  <a href="./history.html" class="soon">History</a>
</nav>

<div class="stat-strip" id="statStrip">
  <div class="stat-card"><div class="label">Members</div><div class="value" id="statMembers">—</div></div>
  <div class="stat-card green"><div class="label">Campaign Funds</div><div class="value" id="statCF">—</div></div>
  <div class="stat-card gold"><div class="label">Net Worth</div><div class="value" id="statNW">—</div></div>
  <div class="stat-card"><div class="label">Mean CS</div><div class="value" id="statCS">—</div></div>
  <div class="stat-card"><div class="label">Mean SR</div><div class="value" id="statSR">—</div></div>
</div>

<div class="controls-wrap">
  <input id="search" type="search" placeholder="Search name, state, or discord…" autocomplete="off">
  <select id="sort">
    <option value="np">Sort: National Prestige</option>
    <option value="nw">Sort: Net Worth</option>
    <option value="cf">Sort: Campaign Funds</option>
    <option value="cs">Sort: Campaign Strength</option>
    <option value="sr">Sort: State Reputation</option>
    <option value="nr">Sort: National Reputation</option>
    <option value="name">Sort: Name</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div id="error"></div>
<div id="loading">Loading roster…</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<div class="footer">
  BFTH War Room · Roster (current) · Caucus (soon) · Elections (soon) · History (soon)
</div>

<script>
const DATA_URL = "./data/players/latest.json";

const money = (n) => n == null ? "—" :
  "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
const num = (n, d = 1) => n == null ? "—" :
  Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n) => n == null ? "—" : num(n, 1) + "%";
const shortMoney = (n) => {
  if (n == null) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return "$" + (n / 1e6).toFixed(1) + "M";
  if (a >= 1e3) return "$" + (n / 1e3).toFixed(0) + "K";
  return "$" + Number(n).toFixed(0);
};
const escapeHtml = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[ch]));
const escapeAttr = (s) => escapeHtml(s).replace(/"/g, "&quot;");

let allPlayers = [];
let filtered = [];
let kofiDiscords = new Set();
let topNP = 1;

function computeTier(p) {
  const np = p.national_prestige ?? 0;
  const cs = p.campaign_strength ?? 0;
  if (np > 10000 || cs > 95) return "tier-s";
  if (np > 5000) return "tier-a";
  if (np < 10 && cs < 20) return "dormant";
  return "tier-b";
}

function buildKofiSet(players) {
  const counts = {};
  for (const p of players) {
    if (p.discord) counts[p.discord] = (counts[p.discord] || 0) + 1;
  }
  kofiDiscords = new Set(
    Object.entries(counts).filter(([, c]) => c >= 3).map(([d]) => d)
  );
}

function computeStats() {
  const n = allPlayers.length || 1;
  let cf = 0, nw = 0, cs = 0, sr = 0;
  for (const p of allPlayers) {
    cf += p.campaign_funds || 0;
    nw += p.total_net_worth || 0;
    cs += p.campaign_strength || 0;
    sr += p.state_reputation || 0;
  }
  document.getElementById("statMembers").textContent = allPlayers.length;
  document.getElementById("statCF").textContent = shortMoney(cf);
  document.getElementById("statNW").textContent = shortMoney(nw);
  document.getElementById("statCS").textContent = num(cs / n, 1);
  document.getElementById("statSR").textContent = num(sr / n, 1) + "%";
  topNP = Math.max(...allPlayers.map(p => p.national_prestige || 0), 1);
}

function render() {
  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = '<div style="color:var(--muted);grid-column:1/-1;text-align:center;padding:2rem">No players match.</div>';
    return;
  }

  grid.innerHTML = filtered.map((p, i) => {
    const tier = computeTier(p);
    const badges = [];
    const party = p.party || "R";
    badges.push(`<span class="badge badge-party">${escapeHtml(party)}</span>`);
    if (p.alt) badges.push(`<span class="badge badge-alt">ALT: ${escapeHtml(p.alt.name || p.alt)}</span>`);
    if (p.marriage && p.marriage !== "Single") {
      badges.push(`<span class="badge badge-married">💍 ${escapeHtml(p.marriage)}</span>`);
    }
    if (p.discord && kofiDiscords.has(p.discord)) {
      badges.push(`<span class="badge badge-kofi">KOFI</span>`);
    }
    if (!p.discord) {
      badges.push(`<span class="badge badge-nodc">NO DISCORD</span>`);
    }
    if (tier === "dormant") {
      badges.push(`<span class="badge badge-dormant">DORMANT</span>`);
    }

    const imgSrc = p.profile_image || "";
    const imgTag = imgSrc
      ? `<img class="avatar" src="${escapeAttr(imgSrc)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
      : `<div class="avatar"></div>`;

    const pid = p.politician_id;
    const nameText = escapeHtml(p.name || "Unknown");
    const nameLink = pid
      ? `<a href="https://battleforthehill.com/politician/${pid}" target="_blank" rel="noopener">${nameText}</a>`
      : nameText;
    const bfthLink = pid
      ? `<a class="bfth-link" href="https://battleforthehill.com/politician/${pid}" target="_blank" rel="noopener">View on BFTH ↗</a>`
      : "";

    const np = p.national_prestige || 0;
    const npBarPct = Math.max(2, Math.min(100, (np / topNP) * 100));

    return `
      <div class="card ${tier}">
        <div class="card-header">
          ${imgTag}
          <div class="info">
            <div class="name-row">
              <span class="rank-chip">#${i + 1}</span>
              <h2>${nameLink}</h2>
            </div>
            <div class="meta-row">
              <span>${escapeHtml(p.state || "—")}</span>
              ${badges.join(" ")}
            </div>
            ${bfthLink}
          </div>
        </div>

        <div class="np-bar-wrap"><div class="np-bar" style="width:${npBarPct}%"></div></div>

        <div class="stat-groups">
          <div class="stat-group">
            <div class="group-label">Power</div>
            <div class="stat"><span class="label">NP</span><span class="val np">${num(p.national_prestige)}</span></div>
            <div class="stat"><span class="label">PC</span><span class="val pc">${num(p.political_capital, 1)}</span></div>
            <div class="stat"><span class="label">Mil</span><span class="val mil">${num(p.military_influence, 0)}</span></div>
          </div>
          <div class="stat-group">
            <div class="group-label">Electoral</div>
            <div class="stat"><span class="label">CS</span><span class="val cs">${num(p.campaign_strength)}</span></div>
            <div class="stat"><span class="label">SR</span><span class="val sr">${pct(p.state_reputation)}</span></div>
            <div class="stat"><span class="label">NR</span><span class="val nr">${pct(p.national_reputation)}</span></div>
          </div>
          <div class="stat-group">
            <div class="group-label">Money</div>
            <div class="stat"><span class="label">CF</span><span class="val cf">${shortMoney(p.campaign_funds)}</span></div>
            <div class="stat"><span class="label">NW</span><span class="val nw">${shortMoney(p.total_net_worth)}</span></div>
            <div class="stat"><span class="label">LC/hr</span><span class="val cf">${shortMoney(p.lc_income_hr)}</span></div>
          </div>
        </div>
      </div>`;
  }).join("");
}

function applyFilterSort() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const sortKey = document.getElementById("sort").value;

  filtered = allPlayers.filter(p => {
    if (!q) return true;
    const hay = [
      p.name, p.state, p.discord,
      p.alt && (p.alt.name || p.alt),
      p.marriage
    ].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  });

  const keyMap = {
    np: "national_prestige",
    nw: "total_net_worth",
    cf: "campaign_funds",
    cs: "campaign_strength",
    sr: "state_reputation",
    nr: "national_reputation"
  };

  if (sortKey === "name") {
    filtered.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  } else {
    const k = keyMap[sortKey];
    filtered.sort((a, b) => (b[k] ?? -Infinity) - (a[k] ?? -Infinity));
  }

  document.getElementById("count").textContent =
    `${filtered.length} of ${allPlayers.length} players`;
  render();
}

function setStatus(ts) {
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  if (!ts) {
    dot.className = "status-dot dead";
    text.textContent = "No timestamp";
    return;
  }
  const age = Date.now() - new Date(ts).getTime();
  const hours = age / 3.6e6;
  dot.className = "status-dot " + (hours < 2 ? "fresh" : hours < 24 ? "stale" : "dead");
  const mins = Math.floor(age / 60000);
  const label = mins < 60 ? `${mins}m ago` :
                hours < 24 ? `${Math.floor(hours)}h ago` :
                `${Math.floor(hours / 24)}d ago`;
  text.textContent = `Updated ${label}`;
}

async function main() {
  const errEl = document.getElementById("error");
  const loadEl = document.getElementById("loading");

  let res;
  try {
    res = await fetch(DATA_URL, { cache: "no-store" });
  } catch (e) {
    loadEl.style.display = "none";
    errEl.textContent = "Fetch failed: " + e.message;
    return;
  }

  if (!res.ok) {
    loadEl.style.display = "none";
    errEl.textContent = `HTTP ${res.status} — ${DATA_URL} not found`;
    return;
  }

  const data = await res.json();
  allPlayers = data.players || [];
  buildKofiSet(allPlayers);
  computeStats();
  setStatus(data.generated_at);

  loadEl.style.display = "none";
  document.getElementById("search").addEventListener("input", applyFilterSort);
  document.getElementById("sort").addEventListener("change", applyFilterSort);
  applyFilterSort();
}

main();
</script>

</html>
