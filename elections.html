<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elections — BFTH War Room</title>
<link rel="icon" href="./images/emblem.png" type="image/png">
<style>
  :root {
    --hero-image: url("./images/banner-elections.png");
    --bg: #08090c; --bg-2: #0d0f14; --panel: #13161d; --panel-2: #1a1e27;
    --border: #242a36; --border-2: #2f3745; --text: #e6e8ec;
    --muted: #8a93a6; --dim: #4a5263;
    --gold: #d4af37; --gold-bright: #f0c850;
    --green: #4ade80; --red: #ef4444; --blue: #60a5fa; --purple: #a78bfa;
    --yellow: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; }
  .hero { position: relative; height: 220px; overflow: hidden;
    border-bottom: 2px solid var(--gold); background: var(--bg-2); }
  .hero-img { position: absolute; inset: 0; background-image: var(--hero-image);
    background-size: cover; background-position: center 45%; opacity: 0.55; }
  .hero::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8,9,12,0.4) 0%, rgba(8,9,12,0.1) 40%, rgba(8,9,12,0.96) 100%); }
  .hero-inner { position: relative; z-index: 2; height: 100%; display: flex;
    align-items: flex-end; justify-content: space-between;
    padding: 0 2rem 1.4rem; max-width: 1600px; margin: 0 auto; gap: 1rem; }
  .brand h1 { font-size: 2.1rem; margin: 0; letter-spacing: 0.08em; color: var(--gold-bright);
    text-shadow: 0 2px 14px rgba(0,0,0,0.85); font-weight: 800; }
  .brand .sub { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.18em;
    text-transform: uppercase; margin-top: 0.4rem; }
  .status { display: flex; align-items: center; gap: 0.5rem;
    background: rgba(13,15,20,0.85); border: 1px solid var(--border-2);
    padding: 0.5rem 0.95rem; border-radius: 999px; font-size: 0.78rem;
    color: var(--muted); backdrop-filter: blur(8px); flex-shrink: 0; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status-dot.fresh { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .status-dot.stale { background: var(--yellow); }
  .status-dot.dead { background: var(--red); }

  .nav { display: flex; background: var(--bg-2); border-bottom: 1px solid var(--border);
    padding: 0 2rem; overflow-x: auto; }
  .nav a { padding: 0.95rem 1.15rem; color: var(--muted); text-decoration: none;
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    border-bottom: 2px solid transparent; white-space: nowrap; transition: color 0.15s; }
  .nav a:hover { color: var(--text); }
  .nav a.active { color: var(--gold-bright); border-bottom-color: var(--gold); }

  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 0.75rem; padding: 1.5rem 2rem 0.75rem; max-width: 1600px; margin: 0 auto; }
  .stat-card { background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.15rem;
    position: relative; overflow: hidden; }
  .stat-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.5; }
  .stat-card .label { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; margin-bottom: 0.45rem; font-weight: 600; }
  .stat-card .value { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em; color: var(--text); }
  .stat-card.gold .value { color: var(--gold-bright); }
  .stat-card.green .value { color: var(--green); }

  .controls { max-width: 1600px; margin: 0 auto; padding: 1.5rem 2rem 0.9rem;
    display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  .controls input, .controls select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 0.65rem 0.95rem; border-radius: 6px; font-size: 0.88rem; font-family: inherit; }
  .controls input:focus, .controls select:focus { outline: none; border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.12); }
  .controls input { flex: 1; min-width: 240px; }
  .controls .count { color: var(--muted); font-size: 0.82rem; margin-left: auto; }

  .grid-wrap { max-width: 1600px; margin: 0 auto; padding: 0 2rem 3rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    gap: 1.25rem; }

  .race { background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--border-2); border-radius: 10px; padding: 1.1rem 1.25rem;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.2s; }
  .race:hover { border-color: var(--border-2); transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.45); }
  .race.live { border-left-color: var(--green); }
  .race.toss { border-left-color: var(--purple); }
  .race.lean-r { border-left-color: var(--red); }
  .race.lean-d { border-left-color: var(--blue); }
  .race.empty { opacity: 0.55; }
  .race.empty:hover { opacity: 0.85; }

  .race-header { display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 0.5rem; gap: 0.5rem; }
  .race-title { font-size: 1rem; font-weight: 700; margin: 0; line-height: 1.25; }
  .race-title a { color: inherit; text-decoration: none; }
  .race-title a:hover { color: var(--gold-bright); }
  .race-meta { color: var(--muted); font-size: 0.72rem; margin-top: 0.25rem;
    letter-spacing: 0.06em; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 3px;
    font-size: 0.66rem; font-weight: 600; letter-spacing: 0.03em; }
  .badge-live { background: #1a3a2a; color: var(--green); }
  .badge-empty { background: #2a1a1a; color: var(--red); }
  .badge-type { background: var(--panel-2); color: var(--muted); }
  .badge-lean-r { background: #3a1414; color: #f87171; }
  .badge-lean-d { background: #14243a; color: #60a5fa; }
  .badge-lean-toss { background: #2a1a3a; color: var(--purple); }

  .polls-bar { display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0 0.85rem;
    font-size: 0.72rem; color: var(--muted); }
  .polls-bar-track { flex: 1; height: 4px; background: var(--bg-2); border-radius: 2px; overflow: hidden; }
  .polls-bar-fill { height: 100%; background: linear-gradient(90deg, var(--border-2), var(--gold));
    border-radius: 2px; transition: width 0.3s ease; }
  .race.empty .polls-bar-fill { background: var(--dim); }

  .cand-table { width: 100%; font-size: 0.82rem; }
  .cand-row { display: grid; grid-template-columns: 1fr auto auto; gap: 0.5rem 0.75rem;
    padding: 0.4rem 0; border-bottom: 1px solid #1a1a22; align-items: center; }
  .cand-row:last-child { border-bottom: none; }
  .cand-name { font-weight: 600; color: var(--text); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .cand-name a { color: inherit; text-decoration: none; }
  .cand-name a:hover { color: var(--gold-bright); }
  .cand-pct { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text);
    text-align: right; min-width: 4rem; }
  .cand-pred { font-size: 0.72rem; color: var(--muted); text-align: right;
    min-width: 4rem; font-variant-numeric: tabular-nums; }
  .cand-pred.has { color: var(--gold); font-weight: 600; }

  .cand-empty { color: var(--muted); font-style: italic; padding: 0.5rem 0; font-size: 0.78rem; }

  #error { color: var(--red); padding: 1rem; background: #1a0a0a;
    border: 1px solid #3a1a1a; border-radius: 6px; margin: 1rem 2rem; }
  #loading { color: var(--muted); text-align: center; padding: 4rem; font-size: 1rem; }

  .footer { border-top: 1px solid var(--border); padding: 1.5rem 2rem;
    color: var(--dim); font-size: 0.75rem; text-align: center; letter-spacing: 0.06em; }

  @media (max-width: 700px) {
    .hero { height: 170px; }
    .hero-inner { padding: 0 1rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .brand h1 { font-size: 1.45rem; }
    .nav { padding: 0 0.5rem; }
    .nav a { padding: 0.8rem 0.7rem; font-size: 0.72rem; }
    .stat-strip, .controls, .grid-wrap { padding-left: 1rem; padding-right: 1rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-img"></div>
  <div class="hero-inner">
    <div class="brand">
      <h1>ELECTIONS</h1>
      <div class="sub">Live Polls &amp; Race Projections</div>
    </div>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Loading…</span>
    </div>
  </div>
</div>

<nav class="nav">
  <a href="./index.html">Roster</a>
  <a href="./caucus.html">Caucus</a>
  <a href="./elections.html" class="active">Elections</a>
  <a href="./history.html">History</a>
</nav>

<div class="stat-strip">
  <div class="stat-card"><div class="label">Active Races</div><div class="value" id="statTotal">—</div></div>
  <div class="stat-card green"><div class="label">With Polls</div><div class="value" id="statPolls">—</div></div>
  <div class="stat-card gold"><div class="label">Senate</div><div class="value" id="statSenate">—</div></div>
  <div class="stat-card gold"><div class="label">Governor</div><div class="value" id="statGov">—</div></div>
  <div class="stat-card gold"><div class="label">House</div><div class="value" id="statHouse">—</div></div>
</div>

<div class="controls">
  <input id="search" type="search" placeholder="Search state, candidate, or race…" autocomplete="off">
  <select id="filter">
    <option value="all">All races</option>
    <option value="polled">Only with polls</option>
    <option value="contested">Only contested (2+ candidates)</option>
    <option value="senate">Senate</option>
    <option value="governor">Governor</option>
    <option value="house">House</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div id="error"></div>
<div id="loading">Loading election data…</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<div class="footer">
  BFTH War Room · Roster · Caucus · Elections · History
</div>

<script>
const DATA_URL = "./data/elections.json";
const CYCLE = 96;

const escapeHtml = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[ch]));

let all = [];
let filtered = [];

function pickClass(e) {
  if (e.polls_count === 0) return "empty";
  if (e.candidates && e.candidates.length >= 2) return "live";
  if (Math.abs(e.overview_lean) < 3) return "toss";
  if (e.overview_lean > 0) return "lean-r";
  return "lean-d";
}

function renderRace(e) {
  const cls = pickClass(e);
  const cands = (e.candidates || []).filter(c => c.final_pct != null);
  const pollsPct = Math.min(100, (e.polls_count / CYCLE) * 100);
  const isContested = (e.candidates || []).length >= 2;

  const badges = [];
  badges.push(`<span class="badge badge-type">${escapeHtml(e.type || "?")}</span>`);
  if (e.polls_count > 0) badges.push(`<span class="badge badge-live">LIVE</span>`);
  else badges.push(`<span class="badge badge-empty">NO POLLS</span>`);
  if (isContested) {
    const lean = e.overview_lean || 0;
    if (Math.abs(lean) < 3) badges.push(`<span class="badge badge-lean-toss">TOSS-UP</span>`);
    else if (lean > 0) badges.push(`<span class="badge badge-lean-r">R+${Math.abs(lean).toFixed(1)}</span>`);
    else badges.push(`<span class="badge badge-lean-d">D+${Math.abs(lean).toFixed(1)}</span>`);
  }

  let candHtml;
  if (cands.length === 0) {
    candHtml = `<div class="cand-empty">No candidates with polling yet</div>`;
  } else {
    candHtml = cands.map(c => {
      const pct = c.final_pct != null ? c.final_pct.toFixed(1) + "%" : "—";
      const pred = c.predicted_final != null
        ? `<span class="cand-pred has">→ ${c.predicted_final.toFixed(1)}%</span>`
        : `<span class="cand-pred">—</span>`;
      const name = c.politician_id
        ? `<a href="https://battleforthehill.com/politician/${c.politician_id}" target="_blank" rel="noopener">${escapeHtml(c.name)}</a>`
        : escapeHtml(c.name);
      return `<div class="cand-row">
        <span class="cand-name">${name}</span>
        <span class="cand-pct">${pct}</span>
        ${pred}
      </div>`;
    }).join("");
  }

  const titleLink = e.url
    ? `<a href="${escapeHtml(e.url)}" target="_blank" rel="noopener">${escapeHtml(e.label || "")}</a>`
    : escapeHtml(e.label || "");

  return `
    <div class="race ${cls}">
      <div class="race-header">
        <div>
          <h2 class="race-title">${titleLink}</h2>
          <div class="race-meta">
            <span>State ${escapeHtml(e.state_id || "?")}</span>
            ${badges.join("")}
          </div>
        </div>
      </div>
      <div class="polls-bar">
        <span>${e.polls_count}/${CYCLE}</span>
        <div class="polls-bar-track"><div class="polls-bar-fill" style="width:${pollsPct}%"></div></div>
        <span>${Math.round(pollsPct)}%</span>
      </div>
      <div class="cand-table">${candHtml}</div>
    </div>`;
}

function applyFilterSort() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const f = document.getElementById("filter").value;

  filtered = all.filter(e => {
    if (f === "polled" && e.polls_count === 0) return false;
    if (f === "contested" && (!e.candidates || e.candidates.length < 2)) return false;
    if (f === "senate" && e.type !== "senate") return false;
    if (f === "governor" && e.type !== "governor") return false;
    if (f === "house" && e.type !== "house") return false;
    if (!q) return true;
    const hay = [e.label, e.type, e.state_id, ...(e.candidates || []).map(c => c.name)]
      .filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  });

  filtered.sort((a, b) => {
    if ((a.polls_count > 0) !== (b.polls_count > 0)) return b.polls_count > 0 ? 1 : -1;
    if (a.polls_count !== b.polls_count) return b.polls_count - a.polls_count;
    return (parseInt(a.election_id) || 0) - (parseInt(b.election_id) || 0);
  });

  document.getElementById("count").textContent =
    `${filtered.length} of ${all.length} races`;
  document.getElementById("grid").innerHTML = filtered.length
    ? filtered.map(renderRace).join("")
    : `<div style="color:var(--muted);grid-column:1/-1;text-align:center;padding:2rem">No races match.</div>`;
}

function setStatus(ts) {
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  if (!ts) { dot.className = "status-dot dead"; text.textContent = "No timestamp"; return; }
  const age = Date.now() - new Date(ts).getTime();
  const hours = age / 3.6e6;
  dot.className = "status-dot " + (hours < 2 ? "fresh" : hours < 24 ? "stale" : "dead");
  const mins = Math.floor(age / 60000);
  const label = mins < 60 ? `${mins}m ago`
    : hours < 24 ? `${Math.floor(hours)}h ago`
    : `${Math.floor(hours / 24)}d ago`;
  text.textContent = `Updated ${label}`;
}

async function main() {
  const errEl = document.getElementById("error");
  const loadEl = document.getElementById("loading");

  let res;
  try {
    res = await fetch(DATA_URL, { cache: "no-store" });
  } catch (e) {
    loadEl.style.display = "none";
    errEl.textContent = "Fetch failed: " + e.message;
    return;
  }
  if (!res.ok) {
    loadEl.style.display = "none";
    errEl.textContent = `HTTP ${res.status} — ${DATA_URL} not found`;
    return;
  }

  const data = await res.json();
  all = data.elections || [];

  document.getElementById("statTotal").textContent = data.total != null ? data.total : all.length;
  document.getElementById("statPolls").textContent = data.with_polls != null ? data.with_polls : 0;
  const byType = data.by_type || {};
  document.getElementById("statSenate").textContent = byType.senate || 0;
  document.getElementById("statGov").textContent = byType.governor || 0;
  document.getElementById("statHouse").textContent = byType.house || 0;

  setStatus(data.generated_at);

  loadEl.style.display = "none";
  document.getElementById("search").addEventListener("input", applyFilterSort);
  document.getElementById("filter").addEventListener("change", applyFilterSort);
  applyFilterSort();
}

main();
</script>

</body>
</html>
